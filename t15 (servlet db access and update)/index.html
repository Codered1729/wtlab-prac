<!DOCTYPE html>
<html>
<head>
    <title>Task 15 - Database Access & Update</title>
</head>
<body>
    <h2>Student Database - Update Record</h2>
    <form action="dbServlet" method="post">
        <table>
            <tr>
                <td>Student ID:</td>
                <td><input type="number" name="id" required></td>
            </tr>
            <tr>
                <td>New Name:</td>
                <td><input type="text" name="name" required></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">Update Record</button>
                </td>
            </tr>
        </table>
    </form>
    <br>
    <a href="dbServlet">View All Student Records (Database Access)</a>
</body>
</html>
